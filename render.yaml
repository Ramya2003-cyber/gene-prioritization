# One-click backend deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: gene-prioritizer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: CLAUDE_SEARCH_LIMIT
        value: "5"
      - key: ALLOWED_ORIGINS
        value: "*"
